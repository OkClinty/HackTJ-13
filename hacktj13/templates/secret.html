<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background-image: url('static/b2.gif');
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed; 
                background-size: cover;
                height: 100vh;
                margin: 0;
                padding: 0; 
            }

            .modal {
                display: none;
                position: fixed;
                z-index: 1;
                padding-top: 100px;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgb(0,0,0);
                background-color: rgba(0,0,0,0.4);
            }

            .modal-content {
                background-color: #fefefe;
                margin: auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
            }

            .close {
                color: #aaaaaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
            }

            .close:hover, .close:focus {
                color: #000;
                text-decoration: none;
                cursor: pointer;
            }

            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #333333;
            }

            ul li {
                float: left;
                border-right:1px solid #bbbbbb;
            }

            ul li:last-child {
                border-right: none;
            }

            ul li a {
                display: block;
                color: white;
                text-align: center;
                padding: 14px 70px;
                text-decoration: none;
            }

            ul li a:hover:not(.active) {
                background-color: #111111;
            }

            ul li a.active {
                background-color: #04AA6D;
            }

            .parent {
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>

    <ul class="parent">
        <li><a class="active">Home</a></li>
        <li><a>Create</a></li>
        <li><a>Simulate</a></li>
        <li><a>About</a></li>
        <li><a id="myBtn">Log Out</a></li>
    </ul>

    <div style="background-color: white; margin-left: 280px; margin-right: 280px; height: 1200px; border-radius: 40px; margin-top: 40px; margin-bottom: 40px">
        <br>
        <h2 style="text-align: center; color: gray; margin-right: 240px"><em>Welcome to...</em></h2>
        <h1 style="text-align: center; font-size: 48px">DirAction</h1>
        
        <div id="myModal" class="modal">
        
            <div class="modal-content">
                <span id="close1" class="close">&times;</span>

                <p>Are you sure you want to log out?</p>
                <form action="/logout">
                    <input type="submit" value="Submit">
                </form>
            </div>

        </div>
    </div>

    <script>
        var modal = document.getElementById("myModal");

        var btn = document.getElementById("myBtn");

        var span1 = document.getElementById("close1");

        btn.onclick = function() {
            modal.style.display = "block";
        }

        span1.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

    </body>
</html>
