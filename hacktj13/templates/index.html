<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {font-family: Arial, Helvetica, sans-serif;}

            .modal {
                display: none;
                position: fixed;
                z-index: 1;
                padding-top: 100px;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgb(0,0,0);
                background-color: rgba(0,0,0,0.4);
            }

            .modal-content {
                background-color: #fefefe;
                margin: auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
            }

            .close {
                color: #aaaaaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
            }

            .close:hover, .close:focus {
                color: #000;
                text-decoration: none;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

    <h2>Home Page</h2>

    <button id="myBtn">Login</button>
    
    <div id="myModal" class="modal">
    
        <div class="modal-content">
            <span id="close1" class="close">&times;</span>

            <form action="/login" method="post">
                <label for="uname">Username:</label><br>
                <input type="text" id="uname" name="uname" value="JohnDoe"><br>
                <label for="pword">Password:</label><br>
                <input type="text" id="pword" name="pword" value="Password123!"><br><br>
                <input type="submit" value="Submit">
            </form> 
        </div>

    </div>

    {% if facts[0] or facts[1] or facts[2] %}
    <div id="myBadModal" class="modal">
    
        <div class="modal-content">
            <span id="close2" class="close">&times;</span>

            <p>
                {% if facts[0] %}
                    Login Failed
                {% elif facts[1] %}
                    You've Successfully Logged Out
                {% elif facts[2] %}
                    Invalid Credentials
                {% endif %}
            </p>
        </div>

    </div>
    {% endif %}

    <script>
        var modal = document.getElementById("myModal");
        var bodal = document.getElementById('myBadModal');

        var btn = document.getElementById("myBtn");

        var span1 = document.getElementById("close1");
        var span2 = document.getElementById("close2");

        btn.onclick = function() {
            modal.style.display = "block";
        }

        span1.onclick = function() {
            modal.style.display = "none";
        }

        span2.onclick = function() {
            bodal.style.display = "none";
        }

        document.addEventListener('DOMContentLoaded', function() {
            bodal.style.display = "block";
        });
    </script>

    </body>
</html>
