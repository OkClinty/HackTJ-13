<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-slate-950 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="flex justify-center">
            <ul class="flex gap-0 list-none">
                <li class="border-r border-slate-700"><a href="/home" class="block text-white px-4 py-4 hover:bg-slate-800 transition-colors">Home</a></li>
                <li class="border-r border-slate-700"><a href="/create" class="block text-white px-8 py-4 bg-purple-600 hover:bg-purple-700 transition-colors font-semibold">Create</a></li>
                <li class="border-r border-slate-700"><a href="/simulate" class="block text-white px-8 py-4 hover:bg-slate-800 transition-colors">Simulate</a></li>
                <li class="border-r border-slate-700"><a href="/about" class="block text-white px-8 py-4 hover:bg-slate-800 transition-colors">About</a></li>
                <li><a id="myBtn" class="block text-white px-8 py-4 hover:bg-slate-800 transition-colors cursor-pointer">Log Out</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-[calc(100vh-80px)] py-8 px-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl p-12">
            <h2 class="text-center text-gray-500 text-lg italic mb-4">Welcome to...</h2>
            <h1 class="text-5xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600 mb-8">DirAction</h1>
        </div>
    </div>

    <!-- Logout Modal -->
    <div id="myModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Confirm Logout</h3>
                <span id="close1" class="text-gray-400 hover:text-gray-600 text-2xl cursor-pointer font-bold">&times;</span>
            </div>
            <p class="text-gray-600 mb-6">Are you sure you want to log out?</p>
            <div class="flex gap-4">
                <button id="close1-btn" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">Cancel</button>
                <form action="/logout" class="flex-1">
                    <input type="submit" value="Log Out" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium cursor-pointer">
                </form>
            </div>
        </div>
    </div>

    <script>
        var modal = document.getElementById("myModal");
        var btn = document.getElementById("myBtn");
        var span1 = document.getElementById("close1");
        var closeBtn = document.getElementById("close1-btn");

        btn.onclick = function() {
            modal.classList.remove("hidden");
        }

        span1.onclick = function() {
            modal.classList.add("hidden");
        }

        closeBtn.onclick = function() {
            modal.classList.add("hidden");
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.classList.add("hidden");
            }
        }
    </script>

    </body>
</html>
